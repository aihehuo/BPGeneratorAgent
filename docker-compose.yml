version: '3.8'

services:
  bp-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bp-generation-api
    ports:
      - "8000:8000"
    env_file:
      - .docker.env
    environment:
      # Output Configuration (overrides from env_file if needed)
      - OUTPUT_DIR=/app/reports
    volumes:
      # Mount reports directory to persist generated reports
      - ./reports:/app/reports
      # Mount sessions directory to persist chat history
      - ./sessions:/tmp/bp_agent_sessions
    extra_hosts:
      # Enable host.docker.internal for callback support (Linux compatibility)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost', 8000); conn.request('GET', '/health'); r = conn.getresponse(); exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

