[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-generation-agent"
version = "1.0.0"
description = "BP Generation Agent - Business Plan Generation using LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.25.0",
    "tavily-python>=0.3.0",
    "streamlit>=1.28.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "rich>=13.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.0.10",
    "langchain-openai>=0.0.5",
    "langserve>=0.0.40",
    "sse-starlette>=1.6.5",
    "httpx[socks]>=0.24.0",
    "markdown>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.0.20",
]

[tool.setuptools]
packages = ["src"]

